name: Update FIRMS Data

'on':
  schedule:
    # Runs every 3 hours at 00:15, 03:15, 06:15, 09:15, 12:15, 15:15, 18:15, 21:15 IST
    # IST is UTC+5:30 -> UTC 18:45, 21:45, 00:45, 03:45, 06:45, 09:45, 12:45, 15:45
    - cron: '45 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-firms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::error::FIRMS_MAP_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          echo "FIRMS_MAP_KEY=${FIRMS_MAP_KEY}" > .env

      - name: Run Pipeline
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_DAY_RANGE: "3"
        run: |
          echo "============================================================"
          echo "Starting Automated FireSight AI FIRMS Pipeline..."
          echo "============================================================"

          # 1. Fetch current FIRMS data (3-day rolling window & boundary filter)
          python india_firms.py

          # 2. Update historical baseline & persistence
          python india_baseline.py

          # 3. Create AI dataset
          python india_ai_dataset.py

          # 4. Ensure trained model exists
          if [ ! -f model/india_fire_classifier.pkl ]; then
            echo "Training AI classifier..."
            python train_india_model.py
          fi

          # 5. Generate Predictions for every current Indian hotspot
          python predict_india_hotspots.py

      - name: Validate Generated Files
        run: |
          python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
            import os
            import sys
            import subprocess
            from datetime import datetime, timezone, timedelta
            import pandas as pd

            ist = timezone(timedelta(hours=5, minutes=30))
            try:
                git_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            except Exception:
                git_sha = 'unknown'

            print("============================================================")
            print("VALIDATING PIPELINE GENERATED FILES")
            print(f"Git Commit SHA : {git_sha}")
            print(f"Validation Time: {datetime.now(ist).strftime('%Y-%m-%d %H:%M:%S IST')}")
            print("============================================================")

            required_files = [
                'data/firms_india.csv',
                'data/firms_india_baseline.csv',
                'data/india_ai_training.csv',
                'data/india_ai_predictions.csv'
            ]

            dfs = {}
            for path in required_files:
                if not os.path.exists(path):
                    print(f'::error::Required file missing: {path}')
                    sys.exit(1)
                size = os.path.getsize(path)
                if size == 0:
                    print(f'::error::Required file is empty: {path}')
                    sys.exit(1)
                try:
                    df = pd.read_csv(path)
                    if len(df) == 0:
                        print(f'::error::File has no data rows: {path}')
                        sys.exit(1)
                    mtime = datetime.fromtimestamp(os.path.getmtime(path), ist).strftime('%Y-%m-%d %H:%M:%S IST')
                    dfs[path] = df
                    print(f'[OK] {path:<32} Rows: {len(df):>5} | Size: {size:>8} bytes | Mtime: {mtime}')
                except Exception as err:
                    print(f'::error::Failed to parse {path}: {err}')
                    sys.exit(1)

            firms_len = len(dfs['data/firms_india.csv'])
            baseline_len = len(dfs['data/firms_india_baseline.csv'])
            pred_len = len(dfs['data/india_ai_predictions.csv'])
            train_len = len(dfs['data/india_ai_training.csv'])

            if firms_len != baseline_len or firms_len != pred_len:
                print(f'::error::Row count mismatch! FIRMS: {firms_len}, Baseline: {baseline_len}, Predictions: {pred_len}')
                sys.exit(1)

            pred_df = dfs['data/india_ai_predictions.csv']
            min_lat, max_lat = pred_df['latitude'].min(), pred_df['latitude'].max()
            min_lon, max_lon = pred_df['longitude'].min(), pred_df['longitude'].max()
            print(f"\nHotspot Geographic Bounds: Lat [{min_lat:.3f}, {max_lat:.3f}], Lon [{min_lon:.3f}, {max_lon:.3f}]")

            ne_count = len(pred_df[(pred_df['longitude'] >= 88.0) & (pred_df['latitude'] >= 21.5)])
            print(f"Northeast India Hotspots : {ne_count}")

            print("\nPipeline Row Summary:")
            print(f"  * FIRMS Hotspots Fetched & Retained : {firms_len}")
            print(f"  * Baseline Assessed Rows            : {baseline_len}")
            print(f"  * AI Dataset Rows (Current+Hist)    : {train_len}")
            print(f"  * AI Predictions Generated          : {pred_len}")
            print("============================================================")
            print("All generated files validated successfully!")
          EOF

      - name: Check for Data Changes and Update Metadata
        id: check_changes
        run: |
          # Compare core data files against repository HEAD
          if git diff --quiet data/firms_india.csv data/india_ai_predictions.csv; then
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "No change detected in FIRMS hotspots or AI predictions. Skipping commit."
          else
            echo "data_changed=true" >> $GITHUB_OUTPUT
            echo "FIRMS data or predictions updated. Generating update metadata."

            python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
            import json
            import os
            import subprocess
            from datetime import datetime, timezone, timedelta

            ist = timezone(timedelta(hours=5, minutes=30))
            now_ist = datetime.now(ist)

            try:
                commit_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            except Exception:
                commit_sha = 'unknown'

            try:
                import pandas as pd
                df = pd.read_csv('data/india_ai_predictions.csv')
                firms_records = len(pd.read_csv('data/firms_india.csv')) if os.path.exists('data/firms_india.csv') else 0
                india_records = len(df)
                industrial_fire_count = int((df['ai_classification'] == 'Industrial Fire').sum()) if 'ai_classification' in df.columns else 0
                high_risk_count = int((df['final_risk_category'] == 'HIGH').sum()) if 'final_risk_category' in df.columns else 0
            except Exception as e:
                firms_records = 0
                india_records = 0
                industrial_fire_count = 0
                high_risk_count = 0
                print(f'Warning reading csv for metadata: {e}')

            meta = {
                'updated_at': now_ist.isoformat(),
                'updated_at_ist': now_ist.strftime('%d %b %Y, %H:%M IST'),
                'commit_sha': commit_sha,
                'firms_records': firms_records,
                'india_records': india_records,
                'industrial_fire_count': industrial_fire_count,
                'high_risk_count': high_risk_count
            }

            with open('data/update_metadata.json', 'w', encoding='utf-8') as f:
                json.dump(meta, f, indent=4)

            print('Generated metadata:', meta)
          EOF
          fi

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/firms_india.csv
          git add data/firms_india_baseline.csv
          git add data/india_ai_training.csv
          git add data/india_ai_predictions.csv
          git add data/update_metadata.json

          git status

          if git diff --staged --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "Auto-update FIRMS data and AI predictions [automated]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Clean up secrets
        if: always()
        run: rm -f .env
